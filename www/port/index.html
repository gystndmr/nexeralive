<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXERA PORT · Daire Seç ve Ödeme Planı | NEXERA İnşaat</title>
<meta name="description" content="NEXERA PORT, Pendik Esenyalı: bina şemasından dairenizi seçin; fiyatını, peşin indirimini ve 36, 24, 12 ay faizsiz ödeme planlarını TL ve USD olarak görün. Türkçe, English, العربية, Русский.">

<style>
/* VOICE: müşteriye dönük, sakin ve güven veren; satış ofisindeki maket masası gibi.
   IDEA: satış ofisindeki bina cephe şeması — kat kat daireler, dokununca dairenin kartı açılır.
   PICTURE: blok şeması (katlar satır, daireler kutu), filtreye uymayanlar soluk; seçili daire altın çerçeve.
   COLOUR and TYPE: NEXERA laciverti #14213d, altın #c9a24a, 1+1 yeşil, 2+1 mavi; Manrope (Arapça: Cairo).
   LAYOUT: lacivert bant + dil seçimi, filtre çubuğu, şema; altında daire kartı, plan, takvim, öncelikli liste formu. */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f8,#0c1222);--paper:light-dark(#fff,#141c30);--ink:light-dark(#14213d,#e9edf6);--mut:light-dark(#5b6475,#9aa4b8);--line:light-dark(#e1e5ec,#26304a);--navy:#14213d;--gold:#c9a24a;--gold2:light-dark(#9c7a2c,#e1c27a);--soft:light-dark(#f7f1e3,#2a2516);--t1:light-dark(#d6f3ea,#173a30);--t1b:#2aa37f;--t2:light-dark(#dde6fb,#1b2a4d);--t2b:#3c64d6;--off:light-dark(#eef0f3,#1a2133);--red:#d63b3b;--amber:#e0a800}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
html[lang=ar] body{font-family:Cairo,Manrope,sans-serif}
.band{padding:clamp(20px,3vw,36px) max(4vw,14px)}
header{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(26px,3.4vw,40px);line-height:1.1;font-weight:800;text-wrap:balance}
header p{margin:6px 0 0;opacity:.82;font-size:15px}
.hr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:10px;padding:4px}
.lang button{min-height:40px;min-width:44px;border:0;border-radius:8px;background:transparent;color:#fff;font:700 14px Manrope,Cairo,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy)}
.logo{background:#fff;border-radius:12px;padding:6px 14px}.logo img{height:42px;display:block}
.wrap{max-width:1240px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tabs button,.seg button,.chips button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 15px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-inline-start:auto}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.filt{display:grid;grid-template-columns:auto auto minmax(0,1fr) minmax(0,1fr);gap:12px 16px;align-items:end;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
@media(max-width:900px){.filt{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:560px){.filt{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{min-height:40px;font-size:14px;padding:0 12px}
.fl{font-size:13px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px}
input,select{width:100%;font:16px inherit;font-family:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.cnt{font-size:14px;font-weight:700;margin-top:8px}.cnt a{color:var(--gold2);cursor:pointer;margin-inline-start:8px}
.scroll{overflow-x:auto;padding-bottom:4px}
.bld{border-collapse:separate;border-spacing:4px;margin:0 auto}
.bld th{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap;padding-right:6px;position:sticky;left:0;background:var(--paper);z-index:1}
.bld td{padding:0}
.u{position:relative;width:66px;height:64px;border-radius:9px;border:1.5px solid transparent;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:2px;transition:opacity .2s}
.u b{font-size:14px}.u small{font-size:10.5px;color:var(--mut)}.u em{font-style:normal;font-size:11px;font-weight:800}
.u.t1{background:var(--t1);border-color:var(--t1b)}.u.t2{background:var(--t2);border-color:var(--t2b)}
.u.off{background:var(--off);border:1.5px dashed var(--line);cursor:default;color:var(--mut)}
.u.dim{opacity:.22}
.u.sold{background:var(--off);border-color:var(--red);color:var(--mut)}.u.sold em{color:var(--red)}
.u.opt{box-shadow:inset 0 0 0 2px var(--amber)}
.u .bd{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:#fff;background:var(--red);border-radius:5px;padding:0 5px;white-space:nowrap}.u .bd.o{background:var(--amber);color:#14213d}
.u.sel{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 6px 16px rgba(201,162,74,.4)}
.st{width:24px;height:64px;border-radius:6px;background:repeating-linear-gradient(0deg,transparent 0 6px,var(--line) 6px 7px)}
.base{text-align:center;font-size:11px;letter-spacing:.5px;color:var(--mut);background:var(--off);border-radius:8px;padding:6px}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;margin-top:20px}
@media(max-width:860px){.det{grid-template-columns:minmax(0,1fr)}}
.ut h2{margin:0;font-size:clamp(24px,3vw,32px);line-height:1.1}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tags span{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.tags .sb{background:var(--red);color:#fff}.tags .ob{background:var(--amber);color:#14213d}
.price{font-size:clamp(28px,3.6vw,40px);font-weight:800;white-space:nowrap}
.k{font-size:13px;color:var(--mut);font-weight:700}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.v{font-size:20px;font-weight:800;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.seg.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:220px}
.l{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 6px}
@media(max-width:600px){.sum{grid-template-columns:minmax(0,1fr)}}
.big{color:var(--gold2)}.sub{font-size:12.5px;color:var(--mut);font-weight:600}
.strip{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:10px;direction:ltr}
.strip i{flex:1;background:linear-gradient(180deg,#3c5aa8,var(--navy));border-radius:3px 3px 0 0}.strip i.d{flex:0 0 64px;background:linear-gradient(180deg,#e0bd6b,var(--gold));border-radius:7px 7px 0 0}
details{margin-top:14px}summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
table.t th{font-size:12.5px;color:var(--mut)}.n{text-align:end!important;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.dp td{background:var(--soft);font-weight:700}tr.tot td{font-weight:800}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;background:var(--gold);color:#14213d;font:800 15px inherit;font-family:inherit;text-decoration:none;border:0;cursor:pointer}
.cta.ghost{background:transparent;border:2px solid var(--gold);color:var(--ink)}
.note{font-size:12.5px;color:var(--mut);margin-top:12px}
.form{margin-top:20px}
.form h3{margin:0 0 4px;font-size:22px}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:760px){.fg{grid-template-columns:minmax(0,1fr)}}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:10px}.ck input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none}
.ck a{color:var(--gold2)}
.msg{margin-top:10px;font-weight:700}.msg.ok{color:#1d7a4c}.msg.er{color:var(--red)}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
footer{font-size:13px;color:var(--mut);text-align:center}
@media(prefers-reduced-motion:reduce){.u{transition:none}}
</style></head><body>

ru:{h1:'NEXERA PORT · Выберите квартиру и посмотрите план оплаты',hsub:'Пендик / Эсеньялы, Стамбул · Прайс-лист 22.11.2026 · Цены с НДС',blkA:'Корпус A · 8 этажей',blkB:'Корпус B · 5 этажей',opt:'Забронирована',sold:'Продана',off:'Не продаётся',fTip:'Тип',all:'Все',fCe:'Вид',ceB:'Сад',ceH:'Аэропорт',ceY:'Улица',ceK:'Угловая',fMax:'Макс. цена (млн TL)',fMon:'Макс. ежемесячный платёж (в выбранной валюте)',hint:'Нажмите на квартиру — ниже откроются цена и варианты оплаты. В каждой ячейке номер, тип и цена (млн TL).',match:n=>`Подходит квартир: ${n}`,clear:'Сбросить фильтры',pay:'Оплата',cash:'Сразу',cur:'Валюта',table:'График платежей по месяцам',ctaList:'В приоритетный список на эту квартиру',ctaWa:'Спросить в WhatsApp',fH:'Записаться в приоритетный список',fAd:'Имя и фамилия',fTel:'Телефон (WhatsApp)',fEp:'E-mail (необязательно)',fKvkk:'Я ознакомился с <a href="/gizlilik/" target="_blank">уведомлением о конфиденциальности</a> об обработке моих данных для этого запроса.',fMk:'Хочу получать новости о кампаниях и старте продаж (необязательно).',fSend:'Отправить',fOk:'Спасибо! Наш консультант скоро свяжется с вами.',fErr:'Не удалось отправить. Напишите нам в WhatsApp: +90 551 272 06 06.',fNeed:'Укажите имя, телефон и подтвердите уведомление.',fNone:'Квартира пока не выбрана; консультант предложит подходящие.',fFor:d=>`Ваш выбор: ${d}`,floor:f=>f?`${f} этаж`:'Цокольный',base:'−1 ПОДВАЛ · ПАРКОВКА · УБЕЖИЩЕ',block:'Корпус',flat:'Квартира',gross:'м² общая',list:'Цена',cashP:'Цена при оплате сразу (−20%)',usd:'В долларах',parking:'Цена за м² растёт с каждым этажом. У каждой квартиры 1 машиноместо.',down:'Первый взнос (50%)',term:'Срок',termV:n=>`${n} мес., 0%`,first:'Первый ежемесячный платёж',monthly:'Ежемесячный платёж',eq:'равный каждый месяц',inc:x=>`растёт каждые 6 месяцев · последний месяц ${x}`,disc:'Скидка (20%)',toPay:'К оплате',allAt:'полностью при договоре',date:'Дата',desc:'Статья',amt:'Сумма',res:'Бронь',kap:'Задаток (5%, вычитается из первого взноса)',kap0:'Задаток (5%)',contract:'Договор',restDown:'Остаток первого взноса',restCash:'Остаток суммы',inst:'Платёж',mo:n=>`${n}-й мес.`,total:'Итого',nUsd:'Суммы в USD рассчитаны по справочному курсу 1 USD = 50,45 TL; применяется курс на день оплаты. ',nTl:'Платежи в TL растут каждые 6 месяцев. ',nGen:'Даты условные; график начинается с даты договора. Задаток — 5% цены, вычитается из первого взноса. Пошлина за тапу, нотариус и подключения оплачивает покупатель.',soldMsg:'Квартира продана. Запишитесь в приоритетный список на похожие.',optMsg:'Квартира забронирована. Сообщим вам первыми, если она освободится.',wa:(d,p)=>`Здравствуйте, хочу узнать о плане оплаты (${p}) для NEXERA PORT ${d}.`,pTxt:(n,c)=>n?`${n} мес., ${c}`:`сразу, ${c}`,foot1:'NEXERA İnşaat · Kartal / Стамбул · +90 551 272 06 06 · nexeralive.com',foot2:'Изображения и схема ориентировочные и уточнятся в архитектурном проекте. NEXERA оставляет за собой право изменять цены и условия.',upd:d=>`Статус обновлён: ${d}`,
 CN:{H:'Сторона аэропорта',HY:'Угловая · аэропорт + улица',HB:'Угловая · аэропорт + сад',HS:'Угловая · аэропорт + боковая',Y:'Сторона улицы',YB:'Угловая · улица + сад',B:'Сторона сада',S:'Боковой фасад',YS:'Угловая · улица + боковая'},T:{'1+1':'1 спальня','2+1':'2 спальни'}}};
const LOC={tr:'tr-TR',en:'en-GB',ar:'ar',ru:'ru-RU'};
const $=id=>document.getElementById(id);
const fT=x=>Math.round(x).toLocaleString('tr-TR')+' TL',fU=x=>'$'+Math.round(x).toLocaleString('en-US');
const r500=x=>Math.round(x/500)*500,r100=x=>Math.round(x/100)*100,r10=x=>Math.round(x/10)*10;
const M=x=>(x/1e6).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{const v=parseFloat(String(s).replace(/\./g,'').replace(',','.'));return isFinite(v)&&v>0?v:0};
const dec=s=>{const v=parseFloat(String(s).replace(',','.'));return isFinite(v)&&v>0?v:0};
let lang='tr',blk='A',sel=null,plan=36,cur='TL',ST=FALLBACK,stDate='',F={tip:'',ce:'',max:0,mon:0};
try{const h=location.hash.slice(1);if(L[h])lang=h;else{const s=localStorage.getItem('nxl');if(L[s])lang=s;else{const n=(navigator.language||'').slice(0,2);if(L[n])lang=n}}}catch(e){}
const t=()=>L[lang];
const bn=b=>({tr:`${b} Blok`,en:`Block ${b}`,ar:`المبنى ${b}`,ru:`Корпус ${b}`})[lang];
const flNum=s=>s==='Zemin'?0:parseInt(s,10);
const status=(b,n)=>(ST[b]&&ST[b][n])||'Satılık';
function find(b,n){for(const [,row] of G[b])for(const c of row)if(c&&c[0]===n&&c.length>2)return c}
function calc(Lp,p=plan,cc=cur){
  const list=cc==='TL'?Lp:r100(Lp/USD),kap=cc==='TL'?Lp*0.05:r100(list*0.05);
  if(!p){const v=cc==='TL'?Lp*0.8:r100(list*0.8);return{list,pay:v,down:v,rows:[],kap}}
  let down,rows=[];
  if(cc==='TL'){down=Lp*0.5;const k=Lp-down,st=STEPS[p].map(s=>r500(k/p*s));for(let i=0;i<p;i++)rows.push(st[Math.floor(i/6)]);rows[p-1]=k-rows.slice(0,-1).reduce((a,b)=>a+b,0)}
  else{const m=r10(list*0.5/p);down=list-p*m;for(let i=0;i<p;i++)rows.push(m)}
  return{list,pay:list,down,rows,kap}
}
function matches(c){
  if(F.tip&&c[3]!==F.tip)return false;
  if(F.ce){const k=c[1];if(F.ce==='K'?!(k.length>1):!k.includes(F.ce))return false}
  if(F.max&&c[5]>F.max*1e6)return false;
  if(F.mon){const x=calc(c[5],plan||36,cur);const m=x.rows.length?x.rows[0]:0;if(m>F.mon)return false}
  return true;
}
const active=()=>F.tip||F.ce||F.max||F.mon;
function drawBld(){
  const g=G[blk];let h='',cnt=0;
  for(const [fl,row] of g){h+=`<tr><th>${t().floor(flNum(fl))}</th>`+row.map(c=>{if(!c)return '<td><div class="st"></div></td>';if(c[0]==null)return '<td></td>';
    if(c.length<3)return `<td><div class="u off" title="${t().off}"><b>${c[0]}</b><small>${t().off}</small></div></td>`;
    const s=status(blk,c[0]),ok=matches(c);if(ok&&s==='Satılık')cnt++;
    const cls=(c[3]==='1+1'?'t1':'t2')+(s==='Satıldı'?' sold':s==='Opsiyonlu'?' opt':'')+(active()&&!ok?' dim':'')+(sel&&sel.b===blk&&sel.n===c[0]?' sel':'');
    const bd=s==='Satıldı'?`<span class="bd">${t().sold}</span>`:s==='Opsiyonlu'?`<span class="bd o">${t().opt}</span>`:'';
    return `<td><button class="u ${cls}" data-n="${c[0]}" aria-label="${t().flat} ${c[0]}, ${c[3]}, ${c[4]} m²">${bd}<b>${c[0]}</b><small>${c[3]} · ${c[4]} m²</small><em>${M(c[5])} M₺</em></button></td>`}).join('')+'</tr>'}
  h+=`<tr><th></th><td colspan="${g[0][1].length}"><div class="base">${t().base}</div></td></tr>`;
  $('bld').innerHTML=h;
  let all=0;for(const b of ['A','B'])for(const [,row] of G[b])for(const c of row)if(c&&c.length>2&&status(b,c[0])==='Satılık'&&matches(c))all++;
  $('cnt').innerHTML=active()?`${t().match(all)}<a id="clr" role="button" tabindex="0">${t().clear}</a>`:(stDate?`<span style="color:var(--mut);font-weight:600">${t().upd(stDate)}</span>`:'');
}
function selText(){if(!sel)return '';const c=find(sel.b,sel.n);return `${bn(sel.b)} · ${t().flat} ${c[0]} (${c[3]}, ${c[4]} m²)`}
function render(){
  $('det').style.display=sel?'':'none';
  $('fSel').textContent=sel?t().fFor(selText()+' · '+t().pTxt(plan,cur)):t().fNone;
  if(!sel)return;
  const c=find(sel.b,sel.n),Lp=c[5],f=cur==='TL'?fT:fU,x=calc(Lp),s=status(sel.b,sel.n),T=t();
  const badge=s==='Satıldı'?`<span class="sb">${T.sold}</span>`:s==='Opsiyonlu'?`<span class="ob">${T.opt}</span>`:'';
  $('ut').innerHTML=`<div class="k">${bn(sel.b)} · ${T.floor(flNum(c[2].replace(' Kat','')))}</div><h2>${T.flat} ${c[0]}</h2><div class="tags">${badge}<span>${T.T[c[3]]}</span><span>${c[4]} ${T.gross}</span><span>${T.CN[c[1]]||''}</span></div><div class="k">${T.list}</div><div class="price">${fT(Lp)}</div><div class="row2"><div><div class="k">${T.cashP}</div><div class="v">${fT(Lp*0.8)}</div></div><div><div class="k">${T.usd}</div><div class="v">${fU(r100(Lp/USD))}</div></div></div><p class="note">${s==='Satıldı'?T.soldMsg:s==='Opsiyonlu'?T.optMsg:T.parking}</p>`;
  let h=`<thead><tr><th>${T.date}</th><th>${T.desc}</th><th class="n">${T.amt}</th></tr></thead><tbody>`;
  if(!plan){$('k1').textContent=T.list;$('v1').textContent=f(x.list);$('k2').textContent=T.disc;$('v2').textContent=f(x.list-x.pay);$('k3').textContent=T.toPay;$('v3').textContent=f(x.pay);$('s3').textContent=T.allAt;
    h+=`<tr class="dp"><td>${T.res}</td><td>${T.kap0}</td><td class="n">${f(x.kap)}</td></tr><tr class="dp"><td>${T.contract}</td><td>${T.restCash}</td><td class="n">${f(x.pay-x.kap)}</td></tr>`;$('strip').innerHTML='<i class="d" style="height:100%;flex:1"></i>'}
  else{const mn=Math.min(...x.rows),mx=Math.max(...x.rows);
    $('k1').textContent=T.down;$('v1').textContent=f(x.down);$('k2').textContent=T.term;$('v2').textContent=T.termV(plan);$('k3').textContent=mn===mx?T.monthly:T.first;$('v3').textContent=f(mn);$('s3').textContent=mn===mx?T.eq:T.inc(f(x.rows[plan-1]));
    h+=`<tr class="dp"><td>${T.res}</td><td>${T.kap}</td><td class="n">${f(x.kap)}</td></tr><tr class="dp"><td>${T.contract}</td><td>${T.restDown}</td><td class="n">${f(x.down-x.kap)}</td></tr>`;
    const d=new Date(),fm=new Intl.DateTimeFormat(LOC[lang],{month:'short',year:'numeric'});
    x.rows.forEach((v,i)=>{h+=`<tr><td>${T.mo(i+1)} · ${fm.format(new Date(d.getFullYear(),d.getMonth()+i+1,1))}</td><td>${T.inst}</td><td class="n">${f(v)}</td></tr>`});
    $('strip').innerHTML='<i class="d" style="height:100%"></i>'+x.rows.map(v=>`<i style="height:${Math.max(4,v/mx*50)}%"></i>`).join('')}
  h+=`<tr class="tot"><td></td><td>${T.total}</td><td class="n">${f(x.pay)}</td></tr></tbody>`;$('tbl').innerHTML=h;
  $('wa').href='https://wa.me/905512720606?text='+encodeURIComponent(T.wa(selText(),T.pTxt(plan,cur)));
  $('note').textContent=(cur==='USD'?T.nUsd:'')+(plan&&cur==='TL'?T.nTl:'')+T.nGen;
}
function applyLang(){
  const T=t();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  for(const el of document.querySelectorAll('[data-t]')){const v=T[el.dataset.t];if(typeof v==='string'){if(el.dataset.t==='fKvkk')el.innerHTML=v;else el.textContent=v}}
  for(const b of $('lang').children)b.setAttribute('aria-pressed',b.dataset.l===lang);
  for(const b of $('plan').children)if(b.dataset.v!=='0')b.textContent=b.dataset.v+(lang==='tr'?' ay':lang==='en'?' mo':lang==='ar'?' شهر':' мес');
  $('fMax').placeholder={tr:'örn. 5,5',en:'e.g. 5.5',ar:'e.g. 5.5',ru:'напр. 5,5'}[lang];
  $('fMon').placeholder=cur==='TL'?'40000':'2000';
  try{localStorage.setItem('nxl',lang)}catch(e){}
  drawBld();render();
}
$('lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{history.replaceState(null,'','#'+lang)}catch(e){}applyLang()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;blk=b.dataset.b;for(const x of $('tabs').querySelectorAll('button'))x.setAttribute('aria-pressed',x===b);drawBld()});
$('bld').addEventListener('click',e=>{const b=e.target.closest('button.u');if(!b)return;sel={b:blk,n:+b.dataset.n};drawBld();render();$('det').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})});
function chips(id,key){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const x of $(id).children)x.setAttribute('aria-pressed',x===b);F[key]=b.dataset.v;drawBld()})}
chips('fTip','tip');chips('fCe','ce');
$('fMax').addEventListener('input',()=>{F.max=dec($('fMax').value);drawBld()});
$('fMon').addEventListener('input',()=>{F.mon=num($('fMon').value);drawBld()});
$('cnt').addEventListener('click',e=>{if(e.target.id!=='clr')return;F={tip:'',ce:'',max:0,mon:0};$('fMax').value='';$('fMon').value='';for(const id of ['fTip','fCe'])for(const x of $(id).children)x.setAttribute('aria-pressed',x.dataset.v==='');drawBld()});
function seg(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const x of $(id).children)x.setAttribute('aria-pressed',x===b);cb(b.dataset.v);$('fMon').placeholder=cur==='TL'?'40000':'2000';drawBld();render()})}
seg('plan',v=>plan=+v);seg('cur',v=>cur=v);
$('frm').addEventListener('submit',async e=>{
  e.preventDefault();const T=t(),m=$('fm');m.className='msg';
  const ad=$('ad').value.trim(),tel=$('tel').value.trim();
  if(!ad||tel.replace(/\D/g,'').length<7||!$('kv').checked){m.textContent=T.fNeed;m.classList.add('er');return}
  $('sb').disabled=true;
  const konu='NEXERA PORT'+(sel?' · '+sel.b+sel.n:'')+' · '+(plan?plan+' ay':'peşin')+' '+cur;
  const body={ad,telefon:tel,eposta:$('ep').value.trim(),konu,not:(sel?selText()+' | ':'')+'Plan: '+T.pTxt(plan,cur)+' | Dil: '+lang,kaynak:'port',sayfa:'/port/',aydinlatma:true,pazarlama:$('mk').checked,web:$('web').value};
  try{const r=await fetch('/api/talep',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;m.textContent=T.fOk;m.classList.add('ok');$('frm').reset()}
  catch(_){m.innerHTML='';m.textContent=T.fErr;m.classList.add('er')}
  $('sb').disabled=false;
});
$('toForm').addEventListener('click',e=>{e.preventDefault();$('liste').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('ad').focus(),400)});
fetch('durum.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.durum){ST=j.durum;stDate=j.guncelleme||'';drawBld();render()}}).catch(()=>{});
applyLang();
}
</script>
