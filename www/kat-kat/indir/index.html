<script>
/* Android: Play Store uygulamasını doğrudan aç (Meta uygulama-içi tarayıcıda da), gelen utm_* referrer'a taşınır; bekleme yok. */
(function(){
  var PKG="app.katkat.game",CMP="katkat_trafik",u=navigator.userAgent||"";
  if(/facebookexternalhit|Facebot|bot|crawl|spider/i.test(u)||!/android/i.test(u))return;
  var q,r={utm_source:"meta",utm_medium:"paid",utm_campaign:CMP},k,ref=[];
  try{q=new URLSearchParams(location.search);["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(function(n){var v=q.get(n);if(v)r[n]=v.slice(0,80)})}catch(e){}
  for(k in r)ref.push(k+"="+encodeURIComponent(r[k]));
  ref=encodeURIComponent(ref.join("&"));
  var web="https://play.google.com/store/apps/details?id="+PKG+"&referrer="+ref;
  try{location.replace("intent://details?id="+PKG+"&referrer="+ref+"#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url="+encodeURIComponent(web)+";end")}catch(e){location.replace(web);return}
  setTimeout(function(){if(document.visibilityState!=="hidden")location.replace(web)},700);
})();
</script>
